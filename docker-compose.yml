services:
  quilicura:
    build:
      context: .
    container_name: quilicura
    restart: unless-stopped
    ports:
      - "4310:4310"
    volumes:
      - quilicura_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  quilicura_data:
